name: CI

on:
  push:
    branches:
      - main
      - dev-refactor
  pull_request:
    branches:
      - main
      - dev-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, pdo, pdo_sqlite
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Run code style
        run: composer lint

      - name: Generate SBOM
        run: composer sbom

      - name: Set artifact date
        run: echo "ARTIFACT_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: doogle_sbom_cyclonedx_${{ env.ARTIFACT_DATE }}_R${{ github.run_number }}
          path: build/sbom.cdx.json
          if-no-files-found: error

